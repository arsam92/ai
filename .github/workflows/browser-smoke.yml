name: Browser smoke tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-smoke:
    name: Chromium / Console / WebGL smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install
      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Check dependency security audit
        run: npm audit --audit-level=high
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run actual browser tests
        run: npm test
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-evidence
          if-no-files-found: warn
          path: |
            playwright-report/
            test-results/
